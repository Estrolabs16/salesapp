name: iOS release IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Swift Package Manager (use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Update CocoaPods spec repo
        run: pod repo update

      - name: Generate Podfile and install pods
        run: flutter build ios --release --no-codesign --config-only

      - name: Install CocoaPods dependencies
        run: cd ios && pod install --repo-update && cd ..

      - name: Build release iOS app (unsigned, xcodebuild)
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP=build/ios-derived/Build/Products/Release-iphoneos/Runner.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr salesapp-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: salesapp-unsigned-ipa
          path: salesapp-unsigned.ipa
          retention-days: 14
